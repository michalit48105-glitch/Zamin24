<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תודה! — זמין24</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10231C;--bg:#F4F6F3;--teal:#128C7E;--green:#1FAD5E;--muted:#5A6B63}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Assistant',sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;flex-direction:column}
header{padding:18px 20px}
.logo{font-family:'Rubik';font-weight:800;font-size:1.5rem}
.logo span{color:var(--teal)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:24px;padding:48px 32px;max-width:480px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(16,35,28,.08)}
.check{width:84px;height:84px;border-radius:50%;background:#E4F5EA;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:2.4rem;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
h1{font-family:'Rubik';font-weight:800;font-size:1.7rem;margin-bottom:12px}
p.sub{color:var(--muted);font-size:1.05rem;margin-bottom:8px}
p.time{font-weight:700;color:var(--teal);margin-bottom:28px}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--green);color:#fff;padding:16px;border-radius:14px;text-decoration:none;font-family:'Rubik';font-weight:600;font-size:1.05rem;box-shadow:0 6px 20px rgba(31,173,94,.35);transition:transform .15s}
.wa-btn:hover{transform:translateY(-2px)}
.or{color:var(--muted);font-size:.9rem;margin:16px 0 10px}
.back{color:var(--teal);text-decoration:none;font-weight:600}
footer{padding:24px;text-align:center;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>

<header><div class="logo">זמין<span>24</span></div></header>

<main>
  <div class="card">
    <div class="check">✅</div>
    <h1>הפרטים התקבלו!</h1>
    <p class="sub">קיבלנו את הפנייה שלך ואנחנו כבר על זה.</p>
    <p class="time">נחזור אליך תוך שעות ספורות 🚀</p>

    <a class="wa-btn" href="https://wa.me/972504666396?text=%D7%94%D7%99%D7%99%2C%20%D7%94%D7%A9%D7%90%D7%A8%D7%AA%D7%99%20%D7%A2%D7%9B%D7%A9%D7%99%D7%95%20%D7%A4%D7%A8%D7%98%D7%99%D7%9D%20%D7%91%D7%90%D7%AA%D7%A8%20%D7%95%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%94%D7%AA%D7%A7%D7%93%D7%9D%20%D7%9B%D7%91%D7%A8%20%D7%A2%D7%9B%D7%A9%D7%99%D7%95%20%F0%9F%99%82">
      💬 רוצה תשובה מהירה יותר? דבר איתנו בוואטסאפ
    </a>

    <p class="or">או</p>
    <a class="back" href="/">חזרה לאתר ←</a>
  </div>
</main>

<footer>זמין24 · העסק שלך עונה, גם כשאתה לא</footer>

</body>
</html>
