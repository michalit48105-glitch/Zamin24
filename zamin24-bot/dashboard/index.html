<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1512">
<title>זמין24 — מרכז שיחות</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1512;--teal:#075E54;--green:#2BD67B;--green-ink:#05210F;--chat:#D9FDD3;--bg:#F4F1EA;--muted:#5B6B64;--ease-out:cubic-bezier(.2,.7,.2,1);--ease-spring:cubic-bezier(.34,1.4,.64,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--ink);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,button{font-family:'Rubik',sans-serif}

/* Login */
#login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#login{background:var(--ink);color:#EAF3EE}
#login .logo{font-weight:900;font-size:2.4rem;letter-spacing:-.03em;animation:rise .6s var(--ease-out) both}
#login .logo span{color:var(--green)}
#login p{color:#9DB0A7;animation:rise .6s var(--ease-out) .08s both}
#login button{background:var(--green);color:var(--green-ink);border:none;padding:15px 30px;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 12px 30px -10px rgba(43,214,123,.6);transition:transform .2s var(--ease-out);animation:rise .6s var(--ease-out) .16s both}
#login button:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* App shell */
#app{flex:1;display:none;flex-direction:column;overflow:hidden}
header{background:var(--ink);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}
header .logo{font-family:'Rubik';font-weight:900;font-size:1.2rem;letter-spacing:-.02em}
header .logo span{color:var(--green)}
header button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:8px;font-size:.8rem;cursor:pointer}

/* Conversation list */
#convList{flex:1;overflow-y:auto;background:#fff}
.conv{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #EFEBE2;cursor:pointer;transition:background-color .15s}
@media(hover:hover){.conv:hover{background:#FAF8F3}}
.conv:active{background:#F5F7F4}
.conv .avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.conv .info{flex:1;min-width:0}
.conv .phone{font-weight:700;font-size:.95rem}
.conv .preview{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.badge{font-size:.65rem;font-weight:700;padding:2px 9px;border-radius:999px}
.badge.bot{background:#E4EFE9;color:var(--teal)}
.badge.human{background:#FFE9C7;color:#9A6200}
.unread{background:var(--green);color:var(--green-ink);animation:badgePop .35s var(--ease-spring);font-size:.7rem;font-weight:700;min-width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center}
#empty{text-align:center;color:var(--muted);padding:48px 24px}

/* Chat view */
#chatView{flex:1;display:none;flex-direction:column;overflow:hidden;background:#ECE5DD}
.chat-top{background:var(--teal);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.chat-top .back{background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;padding:4px}
.chat-top .who{flex:1;font-weight:700}
.mode-btn{border:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:.8rem;cursor:pointer;transition:transform .15s var(--ease-out),background-color .2s}
.mode-btn:active{transform:scale(.95)}
.mode-btn.take{background:#FFB938;color:#5C3A00}
.mode-btn.release{background:#fff;color:var(--teal)}
#messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.bubble.new{animation:bubbleIn .3s var(--ease-spring) both}
.bubble.customer.new{transform-origin:top right}
.bubble.bot.new,.bubble.agent.new{transform-origin:top left}
@keyframes bubbleIn{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1;transform:none}}
@keyframes badgePop{from{transform:scale(.4)}to{transform:scale(1)}}
#chatView.enter{animation:slideIn .32s var(--ease-out)}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.bubble{max-width:82%;padding:8px 12px;border-radius:12px;font-size:.93rem;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bubble.customer{background:#fff;align-self:flex-start;border-top-right-radius:2px}
.bubble.bot{background:var(--chat);align-self:flex-end;border-top-left-radius:2px}
.bubble.agent{background:#C8E8FA;align-self:flex-end;border-top-left-radius:2px}
.bubble .tag{display:block;font-size:.65rem;color:#7a8a80;margin-top:3px;text-align:left}
.composer{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#F0F2EF}
.composer input{flex:1;padding:12px 16px;border:none;border-radius:999px;font-family:'Assistant';font-size:1rem}
.composer input:focus{outline:2px solid var(--green)}
.composer button:active{transform:scale(.92)}
.composer button{background:var(--green);color:var(--green-ink);transition:transform .15s var(--ease-out);border:none;width:46px;height:46px;border-radius:50%;font-size:1.2rem;cursor:pointer;flex-shrink:0}
#botNotice{background:#FFF4DC;color:#7A5500;text-align:center;font-size:.85rem;padding:8px}
</style>
</head>
<body>

<div id="login">
  <div class="logo">זמין<span>24</span></div>
  <p>מרכז השיחות של העסק</p>
  <button id="loginBtn">התחברות עם Google</button>
</div>

<div id="app">
  <header>
    <div class="logo">זמין<span>24</span> · שיחות</div>
    <button id="logoutBtn">יציאה</button>
  </header>

  <div id="convList"><div id="empty">אין שיחות עדיין.<br>כשלקוח יכתוב לבוט — השיחה תופיע כאן בזמן אמת.</div></div>

  <div id="chatView">
    <div class="chat-top">
      <button class="back" id="backBtn">‹</button>
      <div class="who" id="chatWho"></div>
      <button class="mode-btn take" id="modeBtn">קח שליטה</button>
    </div>
    <div id="botNotice" style="display:none">🤖 הבוט עונה בשיחה הזאת. לחץ "קח שליטה" או פשוט כתוב הודעה כדי להצטרף.</div>
    <div id="messages"></div>
    <div class="composer">
      <input id="msgInput" type="text" placeholder="כתוב תשובה כנציג...">
      <button id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

// ⚠️ PLACEHOLDER — להדביק את ה-firebaseConfig של הפרויקט (Console → Project settings → Your apps)
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
  appId: "PASTE_HERE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const dbFS = getFirestore(app);
const fns = getFunctions(app, "europe-west1");
const sendAgentMessage = httpsCallable(fns, "sendAgentMessage");
const setConversationMode = httpsCallable(fns, "setConversationMode");

const $ = (id) => document.getElementById(id);
let currentPhone = null, currentMode = "bot", unsubMsgs = null, unsubConvs = null, seenMsgs = new Set();

$("loginBtn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  $("login").style.display = user ? "none" : "flex";
  $("app").style.display = user ? "flex" : "none";
  if (user) listenConversations(); else unsubConvs?.();
});

function listenConversations() {
  const q = query(collection(dbFS, "wa_conversations"), orderBy("updatedAt", "desc"));
  unsubConvs = onSnapshot(q, (snap) => {
    const list = $("convList");
    if (snap.empty) { list.innerHTML = '<div id="empty">אין שיחות עדיין.</div>'; return; }
    list.innerHTML = "";
    snap.forEach((d) => {
      const c = d.data();
      const el = document.createElement("div");
      el.className = "conv";
      el.innerHTML = `
        <div class="avatar">${d.id.slice(-2)}</div>
        <div class="info">
          <div class="phone">${formatPhone(d.id)}</div>
          <div class="preview">${escapeHtml(c.lastMessage || "")}</div>
        </div>
        <div class="meta">
          <span class="badge ${c.mode === "human" ? "human" : "bot"}">${c.mode === "human" ? "🙋 נציג" : "🤖 בוט"}</span>
          ${c.unread ? `<span class="unread">${c.unread}</span>` : ""}
        </div>`;
      el.onclick = () => openChat(d.id, c.mode || "bot");
      list.appendChild(el);
    });
  });
}

function openChat(phone, mode) {
  currentPhone = phone; currentMode = mode;
  $("convList").style.display = "none";
  $("chatView").style.display = "flex";
  $("chatView").classList.remove("enter"); void $("chatView").offsetWidth; $("chatView").classList.add("enter");
  seenMsgs = null;
  $("chatWho").textContent = formatPhone(phone);
  refreshModeUI();
  updateDoc(doc(dbFS, "wa_conversations", phone), { unread: 0 }).catch(()=>{});
  const q = query(collection(dbFS, "wa_conversations", phone, "messages"), orderBy("ts", "asc"));
  unsubMsgs = onSnapshot(q, (snap) => {
    const box = $("messages");
    box.innerHTML = "";
    const firstLoad = seenMsgs === null;
    if (firstLoad) seenMsgs = new Set();
    snap.forEach((d) => {
      const m = d.data();
      const el = document.createElement("div");
      el.className = "bubble " + (m.sender || "bot") + (!firstLoad && !seenMsgs.has(d.id) ? " new" : "");
      seenMsgs.add(d.id);
      const tag = m.sender === "customer" ? "לקוח" : m.sender === "agent" ? "נציג (אתה)" : "בוט";
      el.innerHTML = escapeHtml(m.text || "") + `<span class="tag">${tag}</span>`;
      box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  });
}

$("backBtn").onclick = () => {
  unsubMsgs?.(); currentPhone = null;
  $("chatView").style.display = "none";
  $("convList").style.display = "block";
};

function refreshModeUI() {
  const btn = $("modeBtn");
  if (currentMode === "human") {
    btn.textContent = "החזר לבוט"; btn.className = "mode-btn release";
    $("botNotice").style.display = "none";
  } else {
    btn.textContent = "קח שליטה"; btn.className = "mode-btn take";
    $("botNotice").style.display = "block";
  }
}

$("modeBtn").onclick = async () => {
  const newMode = currentMode === "human" ? "bot" : "human";
  $("modeBtn").disabled = true;
  try {
    await setConversationMode({ phone: currentPhone, mode: newMode });
    currentMode = newMode; refreshModeUI();
  } catch (e) { alert("שגיאה: " + (e.message || e)); }
  $("modeBtn").disabled = false;
};

async function send() {
  const input = $("msgInput");
  const text = input.value.trim();
  if (!text || !currentPhone) return;
  input.value = ""; $("sendBtn").disabled = true;
  try {
    await sendAgentMessage({ phone: currentPhone, text });
    currentMode = "human"; refreshModeUI(); // שליחה = השתלטות
  } catch (e) { alert("השליחה נכשלה: " + (e.message || e)); input.value = text; }
  $("sendBtn").disabled = false;
}
$("sendBtn").onclick = send;
$("msgInput").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

function formatPhone(p) { return p.startsWith("972") ? "0" + p.slice(3) : p; }
function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
